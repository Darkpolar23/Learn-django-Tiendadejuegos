{% load static %}

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %} Tienda de Video Juegos {% endblock %}</title>

    <!--carga la etiqueta static para poder usar archivos estaticos en el template css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'css/styles.css' %}  ">

    <!--carga la etiqueta static para poder usar archivos estaticos en el template js-->
    <script src="{% static 'js/script.js' %}"></script>

    <script src="https://kit.fontawesome.com/2d4755b001.js" crossorigin="anonymous"></script>
</head>

<body class="text-body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom sticky-top">
        <div class="container-fluid">
            <!-- Logo/Brand -->
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">
                <i class="fa-solid fa-gamepad"></i> Tienda de Video Juegos
            </a>
            
            <!-- Toggle button for mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" 
                    aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar content (collapses on mobile) -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Left nav links -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{% url 'home' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Tienda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Noticias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'contacto' %}">Contacto</a>
                    </li>
                </ul>

                <!-- Search form (center on large screens, full width on mobile) -->
                <form class="d-flex me-lg-3 mb-2 mb-lg-0" role="search">
                    <input class="form-control form-control-sm" type="search" placeholder="Buscar..." 
                           aria-label="Search" />
                    <button class="btn btn-outline-light btn-sm ms-2" type="submit">
                        <i class="fa-solid fa-search"></i>
                    </button>
                </form>

                <!-- Theme toggle button (right side) -->
                <button id="toggle-theme" class="btn btn-outline-light btn-sm" title="Cambiar tema">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </button>
            </div>
        </div>
    </nav>

    {% block content %}
    <!-- ira el contenido de la especifico de la pagina -->

    {% endblock %}

    <footer class="text-center mt-5 mb-3">
        <p>@2025 Tienda de Video Juegos</p>
        <a href="{% url 'home' %}" class="text-body">Inicio</a>
        <a href="{% url 'contacto' %}" class="text-body ms-3">Contacto</a>
    </footer>

    <!-- Bootstrap JS (necesario para el toggle del menú responsivo) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOHFS3dPB1eTRn0DN7ns1ZdvWe"
        crossorigin="anonymous"></script>
</body>

</html>
